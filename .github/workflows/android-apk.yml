name: Construire l'APK Android

# Lancement depuis GitHub : onglet Actions → « Construire l'APK Android » → Run workflow.
# L'APK est ensuite à télécharger dans « Artifacts » en bas de la page de l'exécution.
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/ManagePro-Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Construire l'APK (debug, installable directement)
        run: chmod +x ./gradlew && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ManagerPro-apk-debug
          path: android/ManagePro-Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
